# 1. if Kconfig symbols of board defconfig file needs to modify then use this prj.conf 
# 2. pristine build reset/remove custom K config options so enable them in prj.conf 

#Enable QMC sensor
CONFIG_ENABLE_QMC5883L_SENSOR=y
CONFIG_QMC5883L_RANGE=2000
CONFIG_QMC5883L_ODR=50
CONFIG_QMC5883L_OSR=128

#Enable I2C
CONFIG_I2C=y
CONFIG_SENSOR=y

#Enable GPIO and logging, use logging instead of printk
CONFIG_GPIO=y
#disable logging to use zephyr shell and run commands on shell
CONFIG_LOG=y
#Default level, sets the logging level used by modules that are not setting their own logging level
# log level 0:OFF, 1: ERROR, 2: WARNING ,3: INFO, 4: DEBUG
#CONFIG_LOG_DEFAULT_LEVEL=3    

#Logging in app_sources
CONFIG_ZSW_APP_LOG_LEVEL_WRN=y

#qmc module logging,qmc sensor and zsw app logging set to warning, for usb and ble ota , set to info
CONFIG_SENSOR_LOG_LEVEL_WRN=y

# Enable floating point support for the printf
CONFIG_CBPRINTF_FP_SUPPORT=y

# Enable (FPU) for calculations 
#CONFIG_FPU=y

# NVS
CONFIG_FLASH=y
CONFIG_FLASH_INIT_PRIORITY=40
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_STREAM_FLASH_ERASE=y
CONFIG_FLASH_MAP_LABELS=y

#Enable settings to save calibation data of qmc
CONFIG_SETTINGS=y
CONFIG_NVS=y

#Enable own qmc calibration driver,temporay option 
CONFIG_ENABLE_QMC_CALIBRATION=n
CONFIG_USE_RAW_MAGNETOMETER_DATA=y

#Enable built in driver for mpu6050, can enable options in menuconfig but they reset on pristine build
CONFIG_MPU6050=y
CONFIG_MPU6050_TRIGGER_NONE=y
#CONFIG_MPU6050_GYRO_FS=2000  #update version


#Enbale own IMU driver
CONFIG_ENABLE_IMU=y

#update the log buffer size
CONFIG_LOG_BUFFER_SIZE=2048


#Enable built-in driver of ds3231
CONFIG_RTC=y
CONFIG_RTC_DS3231=y
CONFIG_COUNTER=n

#Enable RTC app code
CONFIG_ENABLE_RTC_TIME=y

#Enable display driver
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y

CONFIG_LV_Z_MEM_POOL_SIZE=16384

#Enable shell for debugging only
CONFIG_LV_Z_SHELL=n
CONFIG_SHELL=n      

CONFIG_LVGL=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_TXT_ENC_UTF8=y
CONFIG_LV_USE_ARC=n

# LVGL Size optimizations
CONFIG_LV_CONF_MINIMAL=y
CONFIG_LV_LABEL_TEXT_SELECTION=n
CONFIG_LV_LABEL_LONG_TXT_HINT=n

CONFIG_LV_Z_BITS_PER_PIXEL=1

#CONFIG_LV_LOG_LEVEL_TRACE=y
CONFIG_LV_LOG_PRINTF=y

CONFIG_MPU_LOG_LEVEL_OFF=y                  # hides all those mpu_configure_region lines

CONFIG_MAIN_STACK_SIZE=3072

CONFIG_LV_Z_VDB_SIZE=16
CONFIG_LV_Z_FULL_REFRESH=n

CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y
CONFIG_LV_FONT_MONTSERRAT_14=n
CONFIG_LV_COLOR_DEPTH_1=y 

CONFIG_LV_Z_BUFFER_ALLOC_DYNAMIC=y


CONFIG_ASSERT=y
CONFIG_ASSERT_NO_COND_INFO=y
CONFIG_ASSERT_NO_MSG_INFO=y
CONFIG_ASSERT_VERBOSE=n
CONFIG_BT_ASSERT_VERBOSE=n   # for optimizing the code size

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Smart_Watch"

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y  #part of app prj.conf as dfu performed from the application,if serial recovery it'll be a part of bootloader prj.conf
CONFIG_ZCBOR=y         # for encode/decode of CBOR
CONFIG_NET_BUF=y

CONFIG_MCUMGR_GRP_OS=y    # enables the OS group in mcumgr, allow CLI tools and aps to execute commands
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y  # enables an application to share info about bootloader(version etc) via MCUmgr SMP
CONFIG_IMG_MANAGER=y       # enable FOTA and DFU image management
CONFIG_STREAM_FLASH=y      # enable stream flash, write data to flash using continuous stream of bytes
CONFIG_BOOTLOADER_MCUBOOT=y


# Allow for large Bluetooth data packets.
CONFIG_BT_L2CAP_TX_MTU=498

# BLE packet type(ACL,Isochronous etc)
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502    
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Enable the Bluetooth mcumgr transport (unauthenticated).
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y #connection parameter control if SMP is used for DFU over ble

# Enable the mcumgr Packet Reassembly feature over Bluetooth and its configuration dependencies.
# MCUmgr buffer size is optimized to fit one SMP packet divided into five Bluetooth Write Commands,
# transmitted with the maximum possible MTU value: 498 bytes.
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608

# Disable Bluetooth ping support
CONFIG_BT_CTLR_LE_PING=n

CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y

#dependencies for dfu over USB CDC ACM
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y

CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_PRODUCT="USBD CDC ACM"

# Configure MCUMGR transport to UART
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y

# Configure dependencies for CONFIG_MCUMGR  
CONFIG_CRC=y

# Configure dependencies for CONFIG_MCUMGR_TRANSPORT_UART 
CONFIG_BASE64=y

#custom Kconfig options to enable dfu
CONFIG_DFU_SUPPORT_ENABLE=y









